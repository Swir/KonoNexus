name: Windows Tester Release

on:
  push:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "assets/kononexus-tester.ico"
      - "docs/TESTING.md"
      - "src/**"
      - "scripts/Verify-KonoNexusEvidence.ps1"
      - ".github/workflows/windows-probe-release.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "assets/kononexus-tester.ico"
      - "docs/TESTING.md"
      - "src/**"
      - "scripts/Verify-KonoNexusEvidence.ps1"
      - ".github/workflows/windows-probe-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-tester:
    name: Build Windows x64 GUI tester
    runs-on: windows-latest
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"
      KONONEXUS_BUILD_COMMIT: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Read package version
        id: package_version
        shell: pwsh
        run: |
          $versionLine = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $versionLine) { throw "Package version not found in Cargo.toml" }
          $version = $versionLine.Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check SDK-only library
        run: cargo check --release --no-default-features --lib

      - name: Build self-contained GUI, diagnostic probe and SDK host
        run: cargo build --release --bin kononexus_tester --bin kononexus_probe --bin kononexus_sdk_host

      - name: Verify embedded tester metadata
        shell: pwsh
        run: |
          $versionInfo = (Get-Item "target\release\kononexus_tester.exe").VersionInfo
          if ($versionInfo.ProductName -ne "KonoNexus Network Tester") {
            throw "Tester ProductName resource is missing"
          }
          if ($versionInfo.FileDescription -ne "KonoNexus WAN / Internet Network Tester") {
            throw "Tester FileDescription resource is missing"
          }

      - name: Verify CRT is statically linked
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio C++ tools not found" }
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found" }
          foreach ($exe in @("target\release\kononexus_tester.exe", "target\release\kononexus_probe.exe")) {
            $deps = & $dumpbin.FullName /dependents $exe | Out-String
            Write-Host $deps
            if ($deps -match '(?i)VCRUNTIME\d*[^\s]*\.dll|MSVCP\d*[^\s]*\.dll|ucrtbase\.dll') {
              throw "$exe still depends on dynamic Visual C++ runtime"
            }
          }

      - name: Prepare package
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.package_version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\kononexus_tester.exe dist\KonoNexus-Network-Tester.exe
          Copy-Item target\release\kononexus_probe.exe dist\kononexus_probe.exe
          Copy-Item target\release\kononexus_sdk_host.exe dist\kononexus_sdk_host.exe
          Copy-Item scripts\Verify-KonoNexusEvidence.ps1 dist\Verify-KonoNexusEvidence.ps1
          Copy-Item docs\TESTING.md dist\TESTING.md
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path dist\Verify-KonoNexusEvidence.ps1).Path,
            [ref] $tokens,
            [ref] $parseErrors
          ) | Out-Null
          if ($parseErrors.Count -ne 0) {
            throw "Verify-KonoNexusEvidence.ps1 has parser errors: $($parseErrors -join '; ')"
          }
          $parameterSets = (Get-Command .\dist\Verify-KonoNexusEvidence.ps1).ParameterSets.Name
          foreach ($requiredSet in @("Report", "Pair", "Matrix", "CreatePair", "CreateMatrix")) {
            if ($parameterSets -notcontains $requiredSet) {
              throw "Verify-KonoNexusEvidence.ps1 is missing parameter set: $requiredSet"
            }
          }
          $expectedBuild = "$env:PACKAGE_VERSION+git.$env:GITHUB_SHA"
          $expectedBuild | Set-Content -Encoding ASCII dist\QUALIFIED-BUILD.txt
          @"
          KonoNexus $env:PACKAGE_VERSION Windows x64 Network Tester

          This package is for controlled external testing.
          The executable is unsigned, so Windows may show a SmartScreen prompt.

          Main file:
          KonoNexus-Network-Tester.exe

          Native public IPv6 matrix row (run on both physical endpoints):
          .\KonoNexus-Network-Tester.exe --bind "[::]:47000"
          The default launch is IPv4-only. One process uses one address family; this
          option does not claim simultaneous dual-stack operation.
          Manually require both signed reports to show evidence.path.method=direct,
          a native IPv6 evidence.path.endpoint, and a public native IPv6
          evidence.nat.observed_external_endpoint. Scenario metadata alone is not proof.

          Diagnostic console and signed-report verifier:
          kononexus_probe.exe

          Long-lived JSON Lines host for native application integration:
          kononexus_sdk_host.exe
          Protocol: https://github.com/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_SHA/docs/SDK-BRIDGE.md

          Qualified signed evidence build:
          $expectedBuild
          Verify-KonoNexusEvidence.ps1 reads this identity automatically.

          Signed reports:
          The GUI writes Ed25519-signed JSON results to
          %LOCALAPPDATA%\KonoNexus\NetworkTester\reports.
          Click START TESTU WAN on both endpoints to produce the reciprocal pair.
          Verify a copied report with:
          powershell.exe -ExecutionPolicy Bypass -File .\Verify-KonoNexusEvidence.ps1 -Report <report.json>

          Create and immediately qualify one reciprocal matrix row:
          powershell.exe -ExecutionPolicy Bypass -File .\Verify-KonoNexusEvidence.ps1 -ReportA <pc-a.json> -ReportB <pc-b.json> -Scenario home_nat_pair -NetworkLabel "ISP A / ISP B" -PairOutput <pair.json> -RequireEligible
          PAIR_VALID proves cryptographic/structural consistency, not a shared physical run.
          Record one operator run ID, synchronized UTC interval and hashes of both GUI
          captures, then confirm both endpoints participated in that same run.

          Create and immediately qualify the incremental seven-scenario manifest:
          powershell.exe -ExecutionPolicy Bypass -File .\Verify-KonoNexusEvidence.ps1 -PairFiles "<pair-1.json>;<pair-2.json>" -MatrixOutput <matrix.json> -RequireReady
          MANUAL_REVIEW_READY=1 still requires human review of the physical network setup.

          WAN note:
          Two fresh nodes behind NAT still need at least one mutually reachable KonoNexus
          bootstrap/coordinator for universal hole-punch and relay fallback. The GUI reports
          real path/evidence and never converts an inconclusive result into a pass.

          Test procedure:
          TESTING.md (included and checksummed in this package)
          https://github.com/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_SHA/docs/TESTING.md
          "@ | Set-Content -Encoding UTF8 dist\README-TEST.txt
          $payloads = @(
            "dist\KonoNexus-Network-Tester.exe",
            "dist\kononexus_probe.exe",
            "dist\kononexus_sdk_host.exe"
          )
          $checksumTargets = $payloads + @(
            "dist\README-TEST.txt",
            "dist\TESTING.md",
            "dist\QUALIFIED-BUILD.txt",
            "dist\Verify-KonoNexusEvidence.ps1"
          )
          $checksumLines = foreach ($payload in $checksumTargets) {
            $hash = (Get-FileHash -Algorithm SHA256 $payload).Hash.ToLowerInvariant()
            "$hash *$([IO.Path]::GetFileName($payload))"
          }
          $checksumLines | Set-Content -Encoding ASCII dist\SHA256SUMS.txt
          $archiveInputs = $checksumTargets + @("dist\SHA256SUMS.txt")
          Compress-Archive -Path $archiveInputs -DestinationPath "KonoNexus-$env:PACKAGE_VERSION-Network-Tester-Windows-x64.zip" -Force
          $zip = "KonoNexus-$env:PACKAGE_VERSION-Network-Tester-Windows-x64.zip"
          $zipHash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$zipHash *$zip" | Set-Content -Encoding ASCII "$zip.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: KonoNexus-${{ steps.package_version.outputs.version }}-Network-Tester-Windows-x64
          path: |
            dist/KonoNexus-Network-Tester.exe
            dist/kononexus_probe.exe
            dist/kononexus_sdk_host.exe
            dist/README-TEST.txt
            dist/TESTING.md
            dist/QUALIFIED-BUILD.txt
            dist/Verify-KonoNexusEvidence.ps1
            dist/SHA256SUMS.txt
            KonoNexus-${{ steps.package_version.outputs.version }}-Network-Tester-Windows-x64.zip
            KonoNexus-${{ steps.package_version.outputs.version }}-Network-Tester-Windows-x64.zip.sha256
          if-no-files-found: error

      - name: Publish prerelease assets
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.package_version.outputs.version }}
        run: |
          $tag = "v$env:PACKAGE_VERSION-tester"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target "$env:GITHUB_SHA" --title "KonoNexus $env:PACKAGE_VERSION Network Tester" --notes "Windows x64 GUI for controlled two-PC WAN/Internet testing. Signed one-code invite, automatic DIRECT → UDP HOLE PUNCH → RELAY path attempt, authenticated delivery RTT/loss, NAT/endpoint evidence, NodeID and technical log. The console probe remains included only for diagnostics. This is a prerelease; real NAT/CGNAT results are evidence, not a universal connectivity guarantee." --prerelease
          } else {
            $tagSha = gh api "repos/$env:GITHUB_REPOSITORY/commits/$tag" --jq .sha
            if ($LASTEXITCODE -ne 0 -or -not $tagSha) {
              throw "Unable to resolve existing release tag $tag"
            }
            if ($tagSha.Trim() -ne $env:GITHUB_SHA) {
              Write-Warning "Release $tag already targets $($tagSha.Trim()); skipping publication for $env:GITHUB_SHA. Bump Cargo.toml before publishing another tester release."
              exit 0
            }
          }
          gh release upload $tag dist\KonoNexus-Network-Tester.exe dist\kononexus_probe.exe dist\kononexus_sdk_host.exe dist\README-TEST.txt dist\TESTING.md dist\QUALIFIED-BUILD.txt dist\Verify-KonoNexusEvidence.ps1 dist\SHA256SUMS.txt "KonoNexus-$env:PACKAGE_VERSION-Network-Tester-Windows-x64.zip" "KonoNexus-$env:PACKAGE_VERSION-Network-Tester-Windows-x64.zip.sha256" --clobber
