name: Windows Probe Release

on:
  push:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - ".github/workflows/windows-probe-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-probe:
    name: Build Windows x64 probe
    runs-on: windows-latest
    env:
      RUSTFLAGS: "-C target-feature=+crt-static"

    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build self-contained release EXE
        run: cargo build --release --bin kononexus_probe

      - name: Verify CRT is statically linked
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio C++ tools not found" }
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found" }
          $deps = & $dumpbin.FullName /dependents target\release\kononexus_probe.exe | Out-String
          Write-Host $deps
          if ($deps -match '(?i)VCRUNTIME\d*[^\s]*\.dll|MSVCP\d*[^\s]*\.dll|ucrtbase\.dll') {
            throw "Probe still depends on dynamic Visual C++ runtime"
          }

      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\kononexus_probe.exe dist\kononexus_probe.exe
          @"
          KonoNexus 0.1.0-alpha.15.3 Windows x64 test probe

          This package is for controlled external testing.
          The executable is unsigned, so Windows may show a SmartScreen prompt.

          Main file:
          kononexus_probe.exe

          Test procedure:
          https://github.com/Swir/KonoNexus/blob/main/docs/TESTING.md
          "@ | Set-Content -Encoding UTF8 dist\README-TEST.txt
          Compress-Archive -Path dist\kononexus_probe.exe,dist\README-TEST.txt -DestinationPath KonoNexus-alpha.15.3-Windows-x64.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: KonoNexus-alpha.15.3-Windows-x64
          path: |
            dist/kononexus_probe.exe
            dist/README-TEST.txt
            KonoNexus-alpha.15.3-Windows-x64.zip
          if-no-files-found: error

      - name: Publish prerelease assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.1.0-alpha.15.3-test"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target "$env:GITHUB_SHA" --title "KonoNexus 0.1.0-alpha.15.3 Testing Candidate" --notes "Windows x64 probe build for controlled multi-PC testing. This is a prerelease/testing candidate, not a stable production release." --prerelease
          }
          gh release upload $tag dist\kononexus_probe.exe KonoNexus-alpha.15.3-Windows-x64.zip --clobber
