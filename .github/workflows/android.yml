name: Android Bridge

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/android.rs"
      - "src/lib.rs"
      - "android/**"
      - "docs/ANDROID-TRANSPORT.md"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/android.rs"
      - "src/lib.rs"
      - "android/**"
      - "docs/ANDROID-TRANSPORT.md"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  lockfile:
    name: Lockfile is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve only the Android feature against the existing lockfile
        run: cargo check --no-default-features --features android-jni --lib
      - name: Preserve generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: android-generated-lockfile
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 3
      - name: Reject an outdated lockfile
        run: git diff --exit-code -- Cargo.lock

  android:
    name: JNI and Android cross-check
    needs: lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --no-default-features --features android-jni --lib
      - run: cargo clippy --locked --no-default-features --features android-jni --lib -- -D warnings
      - run: cargo test --locked --no-default-features --features android-jni --lib
      - run: cargo check --locked --target aarch64-linux-android --no-default-features --features android-jni --lib

  emulator:
    name: AAR and emulator transport
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned Android SDK and NDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path "*/bin/sdkmanager" | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "platform-tools" "emulator" "system-images;android-35;default;x86_64" "ndk;27.2.12479018"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-emulator
      - name: Install pinned cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4 --locked
      - name: Build emulator native library
        run: cargo ndk -t x86_64 -o android/bridge/src/main/jniLibs build --release --locked --no-default-features --features android-jni --lib
      - name: Assemble distributable AAR
        working-directory: android
        run: gradle --no-daemon :bridge:assembleRelease
      - name: Verify AAR payload
        run: |
          unzip -l android/bridge/build/outputs/aar/bridge-release.aar > aar-contents.txt
          grep -Fq "classes.jar" aar-contents.txt
          grep -Fq "jni/x86_64/libkononexus.so" aar-contents.txt
      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: KonoNexus-Android-AAR
          path: android/bridge/build/outputs/aar/bridge-release.aar
          if-no-files-found: error
          retention-days: 90
      - name: Assemble instrumentation APK before emulator boot
        working-directory: android
        run: gradle --no-daemon :bridge:assembleDebugAndroidTest
      - name: Run native transport on API 35 emulator
        timeout-minutes: 18
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          AVDMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path "*/bin/avdmanager" | sort -V | tail -1)"
          test -x "$AVDMANAGER"
          command -v adb
          echo no | "$AVDMANAGER" create avd --force --name kononexus-ci --package "system-images;android-35;default;x86_64" --device pixel_6
          accel=()
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            accel=(-accel off)
          fi
          nohup "$SDK_ROOT/emulator/emulator" -avd kononexus-ci -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048 -cores 2 "${accel[@]}" > emulator.log 2>&1 &
          echo "$!" > emulator.pid
          adb wait-for-device
          ready=0
          stable=0
          for attempt in $(seq 1 180); do
            if adb shell getprop sys.boot_completed 2>/dev/null | grep -qx "1"                 && adb shell pm path android >/dev/null 2>&1                 && adb shell am get-current-user >/dev/null 2>&1; then
              stable=$((stable + 1))
              if [ "$stable" -ge 3 ]; then
                ready=1
                break
              fi
            else
              stable=0
            fi
            sleep 5
          done
          test "$ready" = 1
          cd android
          gradle --no-daemon :bridge:connectedDebugAndroidTest
      - name: Stop emulator
        if: always()
        run: |
          adb emu kill || true
          if [ -f emulator.pid ]; then
            wait "$(cat emulator.pid)" || true
          fi
      - name: Upload emulator reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KonoNexus-Android-emulator-reports
          path: |
            emulator.log
            android/bridge/build/reports/androidTests/connected/**
            android/bridge/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 30
