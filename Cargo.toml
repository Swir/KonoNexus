[package]
name = "kononexus"
version = "0.1.0-alpha.28"
edition = "2021"
license = "MIT"
description = "KonoNexus Protocol (KNP) experimental serverless mesh networking core"
repository = "https://github.com/Swir/KonoNexus"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["tester-gui"]
tester-gui = ["dep:arboard", "dep:eframe", "dep:image", "dep:winresource"]
android-jni = ["dep:jni"]

[dependencies]
anyhow = "1"
arboard = { version = "3.4", optional = true }
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
dirs = "5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
jni = { version = "0.21", optional = true }
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
zeroize = "1"

[[bin]]
name = "kononexus_tester"
path = "src/bin/kononexus_tester.rs"
required-features = ["tester-gui"]

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
