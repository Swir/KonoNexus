[package]
name = "kononexus"
version = "0.1.0-alpha.10"
edition = "2021"
license = "MIT"
description = "KonoNexus Protocol (KNP) experimental serverless mesh networking core"
repository = "https://github.com/Swir/KonoNexus"

[dependencies]
anyhow = "1"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
dirs = "5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
zeroize = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
